name: Domain — Orchestrator

on:
  push:
    paths:
      - 'tools/canonrs-orchestrator/**'
      - 'canonrs-client/**'
  pull_request:
    paths:
      - 'tools/canonrs-orchestrator/**'
      - 'canonrs-client/**'

jobs:
  orchestrator:
    name: Orchestrator Governance
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Build canonrs-core release
        run: cargo build -p canonrs-core --release
      - name: Orchestrator Contracts
        run: python3 tools/testkit/suites/08_orchestrator/check_orchestrator_contracts.py
      - name: Build Artifacts
        run: bash tools/testkit/suites/14_build_artifacts/run_all.sh
      - name: Build Parity
        run: bash tools/testkit/suites/20_build_parity/run_all.sh
