name: CanonRS Governance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  governance:
    name: Architecture + Contracts + Usage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pyyaml

      - name: 01 Architecture
        run: python3 tools/testkit/suites/01_architecture/check_primitives.py

      - name: 02 Lifecycle
        run: bash tools/testkit/suites/02_lifecycle/run_all.sh

      - name: 03 Runtime
        run: bash tools/testkit/suites/03_runtime/run_all.sh

      - name: 08 Orchestrator
        run: python3 tools/testkit/suites/08_orchestrator/check_orchestrator_contracts.py

      - name: 09 Usage
        run: bash tools/testkit/suites/09_usage/run_all.sh

      - name: 10 Runtime Contracts
        run: bash tools/testkit/suites/10_runtime_contracts/run_all.sh

      - name: 11 Hydration Contracts
        run: bash tools/testkit/suites/11_hydration_contracts/run_all.sh

      - name: 12 Overlay Contracts
        run: bash tools/testkit/suites/12_overlay_contracts/run_all.sh

      - name: 13 DOM Driven
        run: bash tools/testkit/suites/13_dom_driven_contracts/run_all.sh

      - name: 14 Build Artifacts
        run: bash tools/testkit/suites/14_build_artifacts/run_all.sh

      - name: 15 Island Contracts
        run: bash tools/testkit/suites/15_island_contracts/run_all.sh

      - name: 16 DOM Topology
        run: bash tools/testkit/suites/16_dom_topology/run_all.sh

      - name: 17 Signal Contracts
        run: bash tools/testkit/suites/17_signal_contracts/run_all.sh

      - name: 18 Canvas Graph
        run: bash tools/testkit/suites/18_canvas_graph_contracts/run_all.sh

      - name: 19 Runtime Groups
        run: bash tools/testkit/suites/19_runtime_groups/run_all.sh

  build:
    name: Build + Parity
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build canonrs-core debug
        run: cargo build -p canonrs-core

      - name: Build canonrs-core release
        run: cargo build -p canonrs-core --release

      - name: Find component_meta.rs
        run: find target -name "component_meta.rs" 2>/dev/null | head -5 || echo "NOT FOUND"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pyyaml

      - name: 20 Build Parity
        run: bash tools/testkit/suites/20_build_parity/run_all.sh
