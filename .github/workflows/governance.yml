name: CanonRS Governance

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── Stage 1: Static Governance ────────────────────────────────────────────
  static-governance:
    name: Static Governance (01-03)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: 01 Architecture
        run: python3 tools/testkit/suites/01_architecture/check_primitives.py

      - name: 02 Lifecycle
        run: bash tools/testkit/suites/02_lifecycle/run_all.sh

      - name: 03 Runtime
        run: bash tools/testkit/suites/03_runtime/run_all.sh

      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-governance-report
          path: tools/testkit/suites/01_architecture/
          retention-days: 7

  # ── Stage 2: Orchestrator + Usage ─────────────────────────────────────────
  usage-governance:
    name: Usage + Contracts (08-19)
    runs-on: ubuntu-latest
    needs: static-governance
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: 08 Orchestrator
        run: python3 tools/testkit/suites/08_orchestrator/check_orchestrator_contracts.py

      - name: 09 Usage
        run: bash tools/testkit/suites/09_usage/run_all.sh

      - name: 10 Runtime Contracts
        run: bash tools/testkit/suites/10_runtime_contracts/run_all.sh

      - name: 11 Hydration Contracts
        run: bash tools/testkit/suites/11_hydration_contracts/run_all.sh

      - name: 12 Overlay Contracts
        run: bash tools/testkit/suites/12_overlay_contracts/run_all.sh

      - name: 13 DOM Driven
        run: bash tools/testkit/suites/13_dom_driven_contracts/run_all.sh

      - name: 14 Build Artifacts
        run: bash tools/testkit/suites/14_build_artifacts/run_all.sh

      - name: 15 Island Contracts
        run: bash tools/testkit/suites/15_island_contracts/run_all.sh

      - name: 16 DOM Topology
        run: bash tools/testkit/suites/16_dom_topology/run_all.sh

      - name: 17 Signal Contracts
        run: bash tools/testkit/suites/17_signal_contracts/run_all.sh

      - name: 18 Canvas Graph
        run: bash tools/testkit/suites/18_canvas_graph_contracts/run_all.sh

      - name: 19 Runtime Groups
        run: bash tools/testkit/suites/19_runtime_groups/run_all.sh

  # ── Stage 3: Build + Parity ───────────────────────────────────────────────
  build-parity:
    name: Build + Release Parity (20)
    runs-on: ubuntu-latest
    needs: static-governance
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build canonrs-core debug
        run: cargo build -p canonrs-core

      - name: Build canonrs-core release
        run: cargo build -p canonrs-core --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: 20 Build Parity
        run: bash tools/testkit/suites/20_build_parity/run_all.sh

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-parity-report
          path: target/release/build/canonrs-core-*/out/generated/
          retention-days: 14

  # ── Stage 3b: HTML Report ────────────────────────────────────────────────
  governance-report:
    name: Governance Report
    runs-on: ubuntu-latest
    needs: [static-governance, usage-governance, build-parity, governance-report]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pyyaml

      - name: Generate HTML Report
        run: |
          mkdir -p /tmp/canonrs-reports
          REPORT_DIR=/tmp/canonrs-reports python3 tools/testkit/lib/generate_report.py
        continue-on-error: true

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-report-${{ github.sha }}
          path: /tmp/canonrs-reports/
          retention-days: 30

  # ── Stage 4: Certification Gate ───────────────────────────────────────────
  certification-gate:
    name: Certification Gate
    runs-on: ubuntu-latest
    needs: [static-governance, usage-governance, build-parity]
    if: always()
    steps:
      - name: Check all stages passed
        run: |
          if [ "${{ needs.static-governance.result }}" != "success" ]; then
            echo "❌ Static governance failed"
            exit 1
          fi
          if [ "${{ needs.usage-governance.result }}" != "success" ]; then
            echo "❌ Usage governance failed"
            exit 1
          fi
          if [ "${{ needs.build-parity.result }}" != "success" ]; then
            echo "❌ Build parity failed"
            exit 1
          fi
          echo "✅ All stages passed — certified"
