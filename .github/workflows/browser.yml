name: CanonRS Browser

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  browser:
    name: Browser + Hydration + Behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          target: wasm32-unknown-unknown

      - name: Cache cargo + cargo-leptos
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-leptos
            target
          key: ${{ runner.os }}-cargo-leptos-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-leptos
        run: |
          if ! command -v cargo-leptos &> /dev/null; then
            cargo install cargo-leptos
          fi

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &> /dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pyyaml

      - name: Start canonrs-site
        run: |
          cargo run -p canonrs-orchestrator canonrs-site &
          sleep 60
        env:
          CANON_DEV: 1

      - name: Install Playwright
        run: npm install playwright && npx playwright install chromium

      - name: 04 Browser / Hydration
        run: bash tools/testkit/suites/04_browser/run_all.sh

      - name: 05 Behavior
        run: bash tools/testkit/suites/05_behavior/run_all.sh

      - name: 06 Contracts
        run: bash tools/testkit/suites/06_contracts/run_all.sh

      - name: 07 Stability
        run: bash tools/testkit/suites/07_stability/run_all.sh
