name: CanonRS Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-parity:
    name: Release Build Parity
    runs-on: ubuntu-latest
    env:
      CANON_SKIP_WASM: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('canonrs-core/Cargo.toml') }}

      - name: Install wasm-pack
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build canonrs-core debug
        run: cargo build -p canonrs-core --no-default-features

      - name: Build canonrs-core release
        run: cargo build -p canonrs-core --release --no-default-features

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pyyaml

      - name: 20 Build Parity
        run: bash tools/testkit/suites/20_build_parity/run_all.sh

      - name: Clippy canonrs-core
        run: cargo clippy -p canonrs-core --no-default-features -- -D warnings -A clippy::should_implement_trait -A clippy::single_char_add_str -A clippy::manual_split_once
