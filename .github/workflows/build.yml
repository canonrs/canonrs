name: CanonRS Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-core:
    name: Build canonrs-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0

      - name: Build canonrs-core release verbose
        run: cargo build -p canonrs-core --release -vv 2>&1 | head -100
