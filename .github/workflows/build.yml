name: CanonRS Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-core:
    name: Build canonrs-core
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.94.0
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-core-${{ hashFiles('**/Cargo.lock') }}

      - name: Build canonrs-core debug
        run: cargo build -p canonrs-core

      - name: Build canonrs-core release
        run: cargo build -p canonrs-core --release

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install pyyaml

      - name: 20 Build Parity
        run: bash tools/testkit/suites/20_build_parity/run_all.sh

      - name: Clippy canonrs-core
        run: cargo clippy -p canonrs-core
