[package]
name = "canonrs-interactions-init"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
  "Window", "Document", "Element", "HtmlElement",
  "EventTarget", "MouseEvent", "KeyboardEvent",
  "DomTokenList", "CssStyleDeclaration",
  "console", "Navigator", "Clipboard",
  "NodeList", "Node", "MutationObserver",
  "MutationObserverInit", "MutationRecord",
  "Location",
  "FocusEvent",
  "EventListener",
  "HtmlInputElement",
  "DomRect",
  "ScrollBehavior",
  "ScrollToOptions",
  "PointerEvent",
  "IntersectionObserver",
  "IntersectionObserverInit",
  "IntersectionObserverEntry",
] }
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }

canonrs-interactions-core = { path = "../canonrs-interactions-core" }

[profile.release]
opt-level = "s"
lto = true
