[workspace]
resolver = "2"
members = [
    "tools/canonrs-cli",
    "tools/canonrs-orchestrator",
    "canonrs-tokens",
    "canonrs",
    "canonrs-style",
    "canonrs-core",
    "canonrs-client",
    "canonrs-interactions-gesture",
    "canonrs-interactions-overlay",
    "canonrs-interactions-selection",
    "canonrs-interactions-nav",
    "canonrs-interactions-data",
    "canonrs-interactions-init",
    "canonrs-interactions-core",
    "canonrs-interactions",
    "canonrs-interactions-content",
    "canonrs-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CanonRS Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/canonrs/canonrs"
homepage = "https://github.com/canonrs/canonrs"
description = "CanonRS — a Leptos-based UI framework for building canonical web applications"

[workspace.dependencies]
leptos                = { version = "0.8", default-features = false }
leptos_meta           = { version = "0.8", default-features = false }
leptos_router         = { version = "0.8", default-features = false }
leptos_axum           = { version = "0.8" }
axum                  = { version = "0.8" }
tokio                 = { version = "1", features = ["full"] }
tower                 = { version = "0.5" }
tower-http            = { version = "0.6" }
serde                 = { version = "1.0", features = ["derive"] }
serde_json            = "1.0"
uuid                  = { version = "1", features = ["v4"] }
wasm-bindgen          = { version = "=0.2.122" }
web-sys               = { version = "=0.3.99" }
js-sys                = { version = "=0.3.99" }
wasm-bindgen-futures  = { version = "=0.4.72" }
canonrs-style                = { path = "canonrs-style" }
canonrs-core                 = { path = "canonrs-core" }
canonrs-client               = { path = "canonrs-client" }
canonrs-interactions         = { path = "canonrs-interactions" }
canonrs-interactions-core    = { path = "canonrs-interactions-core" }
canonrs-interactions-gesture = { path = "canonrs-interactions-gesture" }
canonrs-server               = { path = "canonrs-server", default-features = false }

[workspace.lints.rust]
unused_imports   = "warn"
unused_variables = "warn"
dead_code        = "warn"
unused_mut       = "warn"
unused_parens    = "warn"

[workspace.lints.clippy]
unused_imports = "deny"
