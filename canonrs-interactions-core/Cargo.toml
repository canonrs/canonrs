[package]
name = "canonrs-interactions-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CanonRS interactions core types and traits"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlElement",
    "Event", "EventTarget", "MouseEvent", "KeyboardEvent",
    "FocusEvent", "NodeList", "Node",
    "CssStyleDeclaration", "DomRect",
    "HtmlInputElement",
    "MutationObserver", "MutationObserverInit", "MutationRecord",
    "PointerEvent",
    "History",
    "ScrollToOptions", "ScrollBehavior",
    "IntersectionObserver", "IntersectionObserverInit", "IntersectionObserverEntry",
    "CustomEvent", "CustomEventInit",
    "HtmlCanvasElement", "CanvasRenderingContext2d",
] }

[features]
default = []
