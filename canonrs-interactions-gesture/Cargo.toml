[package]
name = "canonrs-interactions-gesture"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlElement",
    "EventTarget", "MouseEvent", "PointerEvent",
    "CssStyleDeclaration", "DomRect", "NodeList",
    "console", "FocusEvent", "KeyboardEvent",
    "TouchEvent", "WheelEvent", "ResizeObserver",
    "ResizeObserverEntry", "ResizeObserverSize",
    "CustomEvent", "CustomEventInit",
] }

canonrs-interactions-core = { path = "../canonrs-interactions-core" }

[features]
default = []
