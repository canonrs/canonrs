component: color_picker
route: /showcase/color-picker
interaction: selection
min_listeners: 1

guarantees:
  - no_replay
  - listeners_owned
  - no_orphans

behavior:
  opens_on_trigger:
    action: click
    selector: "[data-rs-color-picker-trigger]"
    assert: state_includes
    state: open
    target: "[data-rs-color-picker]"

