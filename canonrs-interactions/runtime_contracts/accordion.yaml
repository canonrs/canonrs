component: accordion
route: /showcase/accordion
interaction: nav
min_listeners: 1

guarantees:
  - no_replay
  - listeners_owned
  - no_orphans

behavior:
  opens_on_trigger:
    action: dispatch_click
    selector: "[data-rs-accordion-trigger]"
    assert: state_includes
    state: open
    target: "[data-rs-accordion-item]"
