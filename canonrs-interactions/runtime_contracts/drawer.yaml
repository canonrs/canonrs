component: drawer
route: /showcase/drawer
interaction: overlay
min_listeners: 1

guarantees:
  - no_replay
  - listeners_owned
  - no_orphans

behavior:
  opens_on_trigger:
    action: click
    selector: "[data-rs-drawer-trigger]"
    assert: state_includes
    state: open
    target: "[data-rs-drawer]"
  closes_on_escape:
    action: key
    key: Escape
    assert: state_excludes
    state: open
    target: "[data-rs-drawer]"
    depends: opens_on_trigger
