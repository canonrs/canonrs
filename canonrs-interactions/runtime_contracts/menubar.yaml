component: menubar
route: /showcase/menubar
interaction: nav
min_listeners: 1

guarantees:
  - no_replay
  - listeners_owned
  - no_orphans

behavior:
  opens_on_trigger:
    action: dispatch_click
    selector: "[data-rs-menubar-trigger]"
    assert: state_includes
    state: open
    target: "[data-rs-menubar-menu]"

  closes_on_escape:
    action: key
    key: Escape
    assert: state_excludes
    state: open
    target: "[data-rs-menubar-menu]"
    depends: opens_on_trigger
