component: tabs
route: /showcase/tabs
interaction: nav
min_listeners: 1

guarantees:
  - no_replay
  - listeners_owned
  - no_orphans

behavior:
  activates_on_click:
    action: dispatch_click
    selector: "[data-rs-tabs-trigger]"
    assert: state_includes
    state: active
    target: "[data-rs-tabs-trigger]"
