[package]
name = "canonrs-interactions-overlay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CanonRS overlay interaction handlers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window", "Document", "Element", "HtmlElement",
    "EventTarget", "MouseEvent", "PointerEvent", "KeyboardEvent",
    "FocusEvent", "WheelEvent", "TouchEvent",
    "CssStyleDeclaration", "DomRect", "NodeList",
    "console", "ResizeObserver", "ResizeObserverEntry",
    "ResizeObserverSize", "ScrollToOptions", "ScrollBehavior",
    "MutationObserver", "MutationObserverInit", "MutationRecord",
    "HtmlInputElement", "Node", "CustomEvent", "CustomEventInit",
] }

canonrs-interactions-core = { version = "0.1.0",  path = "../canonrs-interactions-core" }

[features]
default = []
